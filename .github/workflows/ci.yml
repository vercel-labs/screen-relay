name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version-sync:
    name: Version sync
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: node scripts/check-version-sync.mjs

  engine:
    name: Engine (${{ matrix.runner }})
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config \
            libx11-dev libxext-dev libxdamage-dev libxfixes-dev libxtst-dev \
            libx264-dev libwebsockets-dev libavcodec-dev libavutil-dev libswscale-dev
      - name: Install Wayland build dependencies
        if: matrix.runner == 'ubuntu-24.04'
        run: sudo apt-get install -y --no-install-recommends libwayland-dev libwayland-bin wayland-protocols libxkbcommon-dev
      - run: make -j"$(nproc)" BACKENDS="x11 wayland" relay-engine
        if: matrix.runner == 'ubuntu-24.04'
      - run: make -j"$(nproc)" relay-engine
        if: matrix.runner == 'ubuntu-24.04-arm'
      - run: make BACKENDS="x11 wayland" test
        if: matrix.runner == 'ubuntu-24.04'
      - run: make test
        if: matrix.runner == 'ubuntu-24.04-arm'

  windows:
    name: Engine (Windows)
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            make diffutils
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-libwebsockets mingw-w64-ucrt-x86_64-x264 mingw-w64-ucrt-x86_64-ffmpeg
      - run: make -j"$(nproc)" relay-engine
      - run: make test

  windows-host:
    name: Host (Windows)
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node --test tests/unit/cli-windows.test.mjs
      - name: Install the packed package
        shell: bash
        run: npm install -g "$(npm pack)"
      - name: Remove the runner's MSYS2 so setup installs its own
        shell: pwsh
        run: if (Test-Path C:\msys64) { Remove-Item -LiteralPath C:\msys64 -Recurse -Force }
      - name: Install MSYS2 and its packages and build the engine
        run: screen-relay install --yes
      - name: Check that a second install changes nothing
        shell: bash
        run: |
          output=$(screen-relay install --yes --json)
          echo "$output"
          grep -q unchanged <<< "$output"
      - run: screen-relay doctor
      - run: screen-relay up -d --yes
      - run: screen-relay status
      - name: Run an app on the desktop
        shell: bash
        run: |
          screen-relay run -- 'C:\Windows\System32\where.exe' cmd
          output=$(screen-relay logs apps)
          grep -qi 'cmd.exe' <<< "$output"
      - name: Take a screenshot
        shell: bash
        run: |
          screen-relay screenshot screen.png
          test -s screen.png
      - run: screen-relay down
      - name: Fail if relay-engine.exe is still running
        shell: bash
        run: |
          processes=$(tasklist)
          if grep -qi relay-engine.exe <<< "$processes"; then
            echo "relay-engine.exe is still running"
            exit 1
          fi

  macos:
    name: Engine (${{ matrix.runner }})
    strategy:
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: brew install pkgconf x264 libwebsockets ffmpeg
      - run: make -j"$(sysctl -n hw.ncpu)" relay-engine
      - run: make test
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node --test tests/unit/cli.test.mjs tests/unit/cli-state.test.mjs tests/unit/cli-apps.test.mjs
      - run: npm install -g "$(npm pack)"
      - run: screen-relay install --yes

  node:
    name: SDK and CLI (Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        node: ['22.0.0', 22, 24, 26]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Typecheck the MCP App example
        working-directory: examples/mcp-app
        run: |
          npm ci --ignore-scripts
          npm run typecheck

  smoke:
    name: Install and smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm install -g "$(npm pack)"
      - run: screen-relay install --yes
      - run: tests/smoke.sh

  smoke-wayland:
    name: Install and smoke test (Wayland spawn)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm install -g "$(npm pack)"
      - run: screen-relay install --backend wayland --yes
      - run: SCREEN_RELAY_BACKEND=wayland tests/smoke.sh

  smoke-wayland-attach:
    name: Install and smoke test (Wayland attach)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm install -g "$(npm pack)"
      - run: screen-relay install --backend wayland --yes
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends labwc
      - name: Smoke test against labwc
        run: |
          set -eu
          runtime=$(mktemp -d)
          export XDG_RUNTIME_DIR=$runtime
          WLR_BACKENDS=headless WLR_RENDERER=pixman WLR_HEADLESS_OUTPUTS=1 labwc > "$runtime/labwc.log" 2>&1 &
          socket=''
          x11=''
          for _ in $(seq 100); do
            socket=$(find "$runtime" -maxdepth 1 -type s -name 'wayland-*' -print -quit)
            x11=$(find /tmp/.X11-unix -maxdepth 1 -type s -name 'X*' -print -quit 2>/dev/null || true)
            if [ -n "$socket" ] && [ -n "$x11" ]; then break; fi
            sleep 0.2
          done
          if [ -z "$socket" ] || [ -z "$x11" ]; then cat "$runtime/labwc.log"; exit 1; fi
          DISPLAY=":${x11##*/X}" SCREEN_RELAY_BACKEND=wayland SCREEN_RELAY_DISPLAY="${socket##*/}" tests/smoke.sh

  macos-token-acl:
    name: macOS token ACL
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: brew install pkgconf libwebsockets openssl
      - name: Compile the server sources
        run: |
          for source in src/engine/server/*.cpp; do
            c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -pthread -DRELAY_BACKEND_x11 -Isrc/engine -c "$source" \
              $(pkg-config --cflags libwebsockets openssl) -o /dev/null
          done
      - run: |
          mkdir -p build
          c++ -std=c++17 -Wall -Wextra -Wpedantic -pthread -Isrc/engine $(pkg-config --cflags libwebsockets openssl) tests/unit/macos-config-test.cpp src/engine/server/config.cpp -o build/macos-config-test $(pkg-config --libs libwebsockets openssl)
          ./build/macos-config-test

  install:
    name: Install (${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:trixie
            setup: apt-get update && apt-get install -y --no-install-recommends libatomic1 &&
          - image: ubuntu:24.04
            setup: apt-get update && apt-get install -y --no-install-recommends libatomic1 &&
          - image: ubuntu:26.04
            setup: apt-get update && apt-get install -y --no-install-recommends libatomic1 &&
          - image: fedora:44
            setup: dnf -y install libatomic https://download1.rpmfusion.org/free/fedora/rpmfusion-free-release-44.noarch.rpm &&
          - image: archlinux:latest
          - image: alpine:3.24
            setup: apk add --no-cache nodejs npm &&
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: mv "$(npm pack)" screen-relay.tgz
      - name: Install from the package in the container
        run: >-
          docker run --rm -v "$PWD:/src:ro"
          -v "$(dirname "$(dirname "$(readlink -f "$(command -v node)")")"):/opt/node:ro"
          -e npm_config_prefix=/usr/local
          -e PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/opt/node/bin
          "${{ matrix.image }}"
          sh -c '${{ matrix.setup }} npm install -g /src/screen-relay.tgz && screen-relay install --yes && screen-relay install --backend wayland --desktop none --yes --json | grep -Eq "x11.{3}wayland" && screen-relay install --backend all --desktop none --yes && SCREEN_RELAY_BACKEND=wayland screen-relay doctor'

  image:
    name: Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t screen-relay .
      - run: docker run --rm --entrypoint screen-relay screen-relay doctor

  ci:
    name: CI
    if: always()
    needs: [version-sync, engine, windows, windows-host, macos, node, smoke, smoke-wayland, smoke-wayland-attach, macos-token-acl, install, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            [ "$result" = success ] || { echo "A job ended as $result"; exit 1; }
          done
